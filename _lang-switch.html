<script>
document.addEventListener('DOMContentLoaded', function() {
  var isEN = window.location.pathname.includes('/en/');
  var navItems = document.querySelectorAll('.navbar-nav .nav-item.dropdown');
  navItems.forEach(function(item) {
    var toggle = item.querySelector('.dropdown-toggle');
    if (toggle && toggle.textContent.trim() === 'EN') {
      var path = window.location.pathname;
      var enPath, esPath;
      if (isEN) {
        enPath = path;
        esPath = path.replace('/en/', '/');
      } else {
        esPath = path;
        var base = path.split('/').pop() || 'index.html';
        enPath = path.replace(base, 'en/' + base);
      }

      var container = document.createElement('li');
      container.className = 'nav-item';
      container.innerHTML =
        '<a class="nav-link" href="' + (isEN ? esPath : enPath) + '" style="font-size:0.85em; opacity:0.8;">' +
        (isEN ? 'ES' : 'EN') + '</a>';

      item.replaceWith(container);
    }
  });
});
</script>
