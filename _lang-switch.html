<script>
(function () {
  var brand = document.querySelector(".navbar-brand");
  if (!brand) return;

  var rootPath = new URL(brand.getAttribute("href"), window.location.href).pathname
    .replace(/index\.html$/, "");
  if (!rootPath.endsWith("/")) rootPath += "/";

  var path = window.location.pathname;
  var enPrefix = rootPath + "en/";
  var isEN = path === rootPath + "en" || path.indexOf(enPrefix) === 0;

  var target = isEN
    ? rootPath + path.slice(enPrefix.length)
    : enPrefix + path.slice(rootPath.length);

  var nav = document.querySelector(".navbar .navbar-nav");
  if (nav) {
    var li = document.createElement("li");
    li.className = "nav-item";
    li.innerHTML =
      '<a class="nav-link lang-toggle" href="' + target + '" title="' +
      (isEN ? "Versión en español" : "English version") + '"><b>' +
      (isEN ? "ES" : "EN") + "</b></a>";
    nav.appendChild(li);
  }

  if (!isEN) return;

  var labels = {
    "Inicio": "Home",
    "Experiencia": "Experience",
    "Docencia": "Teaching",
    "Proyectos": "Projects",
    "Certificaciones": "Certifications"
  };
  document.querySelectorAll(".navbar .menu-text").forEach(function (el) {
    var t = el.textContent.trim();
    if (labels[t]) el.textContent = labels[t];
  });

  document.querySelectorAll(".navbar a.nav-link, .navbar a.navbar-brand").forEach(function (a) {
    if (a.classList.contains("lang-toggle")) return;
    var href = a.getAttribute("href");
    if (!href || /^(https?:|mailto:|#)/.test(href)) return;
    var abs = new URL(href, window.location.href).pathname;
    if (abs.indexOf(rootPath) === 0 && abs.indexOf(enPrefix) !== 0) {
      a.setAttribute("href", enPrefix + abs.slice(rootPath.length));
    }
  });

  var footer = document.querySelector(".nav-footer .nav-footer-left");
  if (footer) {
    footer.innerHTML = footer.innerHTML
      .replace("Sitio hecho con", "Site built with")
      .replace(", por Mauro Loprete. Licencia:", ", by Mauro Loprete. License:");
  }
})();
</script>
