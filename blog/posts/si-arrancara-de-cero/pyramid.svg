<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Databricks -->
  <rect x="195" y="10" width="210" height="65" rx="10" fill="#7c3aed" filter="url(#shadow)"/>
  <text x="300" y="37" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16">Databricks</text>
  <text x="300" y="57" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="11" opacity="0.85">Unity Catalog · DABs · LDP</text>

  <!-- dbt -->
  <rect x="145" y="85" width="310" height="65" rx="10" fill="#ea580c" filter="url(#shadow)"/>
  <text x="300" y="112" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16">dbt</text>
  <text x="300" y="132" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="11" opacity="0.85">Transformación modular en SQL</text>

  <!-- Apache Spark -->
  <rect x="85" y="160" width="430" height="65" rx="10" fill="#2563eb" filter="url(#shadow)"/>
  <text x="300" y="187" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16">Apache Spark</text>
  <text x="300" y="207" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="11" opacity="0.85">Procesamiento distribuido</text>

  <!-- Python + SQL -->
  <rect x="25" y="235" width="550" height="65" rx="10" fill="#0d9488" filter="url(#shadow)"/>
  <text x="300" y="262" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16">Python + SQL</text>
  <text x="300" y="282" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="11" opacity="0.85">Los fundamentos — no hay atajo</text>

  <!-- Arrows -->
  <path d="M300 75 L300 85" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M300 150 L300 160" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M300 225 L300 235" stroke="#94a3b8" stroke-width="2" fill="none"/>
</svg>
