name: Auto-publish scheduled drafts

on:
  schedule:
    - cron: "0 22 * * *"  # 19:00 Uruguay (UTC-3)
  workflow_dispatch:       # manual trigger

permissions:
  contents: write

jobs:
  auto-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for drafts to publish
        id: check
        run: |
          python .github/scripts/auto_publish.py
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/posts/*/index.qmd
          git commit -m "blog: publicar posts programados"
          git push
