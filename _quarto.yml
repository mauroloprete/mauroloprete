project:
  type: website
  render:
    - "*.qmd"
    - "blog/"
    - "slides/"
    - "!linkedin-posts.md"
    - "!**/*.rmarkdown"

website:
  title: "Mauro Loprete"
  description: "Data Engineer & Statistician — Blog sobre Databricks, Data Engineering, MLOps y procesamiento de encuestas en América Latina."
  page-navigation: true
  site-url: "https://mauroloprete.github.io/mauroloprete/"
  favicon: mauro.jpg
  open-graph:
    locale: es_UY
    site-name: "Mauro Loprete"
    image: mauro.jpg
  twitter-card:
    card-style: summary_large_image
    image: mauro.jpg
    creator: "@mloprete17"
  # google-analytics: "G-XXXXXXXXXX"  # Completar con tu ID de GA4
  page-footer:
    left: "Sitio hecho con [Quarto](https://quarto.org/), por Mauro Loprete. Licencia: [CC BY-SA 2.0](https://creativecommons.org/licenses/by-sa/2.0/)."
  navbar:
    right:
      - href: index.qmd
        text: Inicio
      - href: experience.qmd
        text: Experiencia
      - href: teaching.qmd
        text: Docencia
      - href: projects.qmd
        text: Proyectos
      - href: certifications.qmd
        text: Certificaciones
      - href: blog/index.qmd
        text: Blog
      - href: slides.qmd
        text: Slides

lang: es
language:
  title-block-author-single: "Autor"
  title-block-author-plural: "Autores"
  title-block-published: "Publicado"
lightbox: true
format:
  html:
    theme: pulse
    css: styles.css
    toc: true
    include-after-body: _scroll-animations.html
editor: visual

execute:
  freeze: false
