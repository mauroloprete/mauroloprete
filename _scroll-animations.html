<script>
function initScrollAnimations() {
  var targets = document.querySelectorAll(
    'h2, h3, .callout, .quarto-figure, .cell-output-display, ' +
    'table, .quarto-grid-item, .card, pre.sourceCode, blockquote'
  );

  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, {
    threshold: 0.1,
    rootMargin: '0px 0px -40px 0px'
  });

  targets.forEach(function(el) {
    if (!el.classList.contains('fade-in')) {
      el.classList.add('fade-in');
      observer.observe(el);
    }
  });
}

function initTocToggle() {
  // Solo en páginas con headings de artículo (posts)
  var headings = document.querySelectorAll('main.content h2, main.content h3');
  if (headings.length < 2) return;

  // No duplicar
  if (document.getElementById('toc-toggle-btn')) return;

  // Construir panel TOC flotante
  var panel = document.createElement('div');
  panel.id = 'toc-floating-panel';

  var title = document.createElement('div');
  title.className = 'panel-title';
  title.textContent = 'En esta página';
  panel.appendChild(title);

  var list = document.createElement('ul');
  var currentSublist = null;

  headings.forEach(function(h) {
    // Asegurar que tenga id para el anchor
    if (!h.id) {
      h.id = h.textContent.toLowerCase().replace(/[^a-záéíóúñü0-9]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
    }

    var li = document.createElement('li');
    var a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;

    // Cerrar TOC al clickear un link
    a.addEventListener('click', function() {
      panel.classList.remove('toc-visible');
      btn.innerHTML = '☰';
    });

    li.appendChild(a);

    if (h.tagName === 'H2') {
      list.appendChild(li);
      // Preparar sublista para H3s
      currentSublist = document.createElement('ul');
      li.appendChild(currentSublist);
    } else if (h.tagName === 'H3' && currentSublist) {
      currentSublist.appendChild(li);
    }
  });

  // Limpiar sublistas vacías
  list.querySelectorAll('ul:empty').forEach(function(ul) { ul.remove(); });

  panel.appendChild(list);
  document.body.appendChild(panel);

  // Botón toggle
  var btn = document.createElement('button');
  btn.id = 'toc-toggle-btn';
  btn.innerHTML = '☰';
  btn.title = 'Mostrar/ocultar índice';
  document.body.appendChild(btn);

  btn.addEventListener('click', function(e) {
    e.stopPropagation();
    panel.classList.toggle('toc-visible');
    btn.innerHTML = panel.classList.contains('toc-visible') ? '✕' : '☰';
  });

  // Cerrar al clickear fuera
  document.addEventListener('click', function(e) {
    if (!panel.contains(e.target) && e.target !== btn && panel.classList.contains('toc-visible')) {
      panel.classList.remove('toc-visible');
      btn.innerHTML = '☰';
    }
  });
}

// Primera carga
document.addEventListener("DOMContentLoaded", function() {
  initScrollAnimations();
  initTocToggle();
});

// Navegación interna de Quarto (SPA-like)
window.addEventListener("quarto-page-loaded", function() {
  initScrollAnimations();
  // Limpiar TOC anterior si existe
  var oldPanel = document.getElementById('toc-floating-panel');
  var oldBtn = document.getElementById('toc-toggle-btn');
  if (oldPanel) oldPanel.remove();
  if (oldBtn) oldBtn.remove();
  initTocToggle();
});
</script>
